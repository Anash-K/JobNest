# PostgreSQL for local development (Phase 0).
# Start: pnpm db:up  (uses docker-compose)
services:
  postgres:
    image: postgres:16-alpine
    container_name: jobhunter-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter
      POSTGRES_DB: jobhunter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunter"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
